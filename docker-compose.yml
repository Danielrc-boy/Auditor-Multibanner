version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local_shelf_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: shelf_monitoring
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d shelf_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5